name: iOS - Build & TestFlight

# Compila la app MAUI para iOS en un runner macOS de GitHub, firma la IPA
# con el certificado/perfil de la cuenta Apple Developer y la sube a TestFlight.
#
# NO requiere una Mac local. Todo corre en los runners macOS de GitHub.
#
# Se dispara manualmente (workflow_dispatch) para que tu controles cuando se
# genera una build, y tambien al hacer push de un tag "v*" (ej. v1.2.0).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # .NET 10: la app se homologo a .NET 10 (TargetFrameworks net10.0-android /
  # net10.0-ios en el csproj). El SDK 9.0.x ya NO compila este proyecto.
  DOTNET_VERSION: '10.0.x'
  PROJECT: appmetepec/appmetepec.csproj
  # Bundle id real de la app del Ayuntamiento (misma que "Metepec *7311" de
  # produccion). El GoogleService-Info.plist debe corresponder a este bundle
  # para que Firebase no crashee al arrancar.
  BUNDLE_ID: mx.gob.edomex.metepec.gc
  CONFIGURATION: Release

jobs:
  build-ios:
    # Apple exige (desde 2025/2026) compilar con el SDK de iOS 26 / Xcode 26
    # para subir a App Store Connect. El runner macos-26 (Tahoe) trae Xcode 26
    # y el SDK iOS 26 preinstalados.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # El workload ".NET for iOS 26.5.10318" (ver "Install MAUI workloads") exige
      # Xcode 26.6, que es la version MAS NUEVA disponible en el runner macos-26
      # (no hay Xcode 27, que pediria el workload 27.0.x). Preferimos el bundle
      # "Xcode_26.6.app" (instalacion completa) sobre "Xcode_26.6.0.app", que en
      # el runner puede estar incompleto (le falta MacOSX.sdk que usa actool).
      # Apuntamos a Contents/Developer y forzamos runFirstLaunch para activar
      # los componentes/SDKs. Verificamos que el SDK de macOS exista.
      - name: Select Xcode 26.6
        run: |
          echo "Versiones de Xcode disponibles:"
          ls -d /Applications/Xcode_*.app || true
          XC=""
          for cand in /Applications/Xcode_26.6.app /Applications/Xcode_26.6.0.app; do
            if [ -d "$cand" ]; then XC="$cand"; break; fi
          done
          if [ -z "$XC" ]; then XC="$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | sort -V | head -n 1)"; fi
          echo "Usando $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          echo "SDKs instalados:"
          xcodebuild -showsdks
          echo "Verificando SDK de macOS (necesario para actool):"
          ls "$XC/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/" || true

      # Workloads MAUI FIJADOS al workload set 10.0.401. Ese set instala
      # Microsoft.iOS 26.5.10318, que es la version de .NET for iOS que empareja
      # con Xcode 26.6 (el Xcode mas nuevo disponible en el runner macos-26).
      # NO usar 'dotnet workload restore' sin version: trae el ultimo set, que
      # instala iOS 27.0.10722 y exige Xcode 27.0 (no disponible en el runner) ->
      # el build fallaba con "requires Xcode 27.0". Al pinear 10.0.401 el workload
      # queda alineado con el Xcode 26.6 seleccionado arriba. Ref: dotnet/macios
      # ".NET 10 - Xcode 26.6 support (26.5.10318)".
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --version 10.0.401
          dotnet workload list

      # --- Firma de codigo -------------------------------------------------
      # Importa el certificado .p12 a un keychain temporal y el provisioning
      # profile al directorio donde Xcode/msbuild lo buscan.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
          # Extrae el nombre (Name) del perfil para pasarlo a msbuild.
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision" > $RUNNER_TEMP/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      # Version de display > 1.2.7 (produccion) y un build number UNICO basado
      # en fecha/hora, para que TestFlight nunca rechace por duplicado. Estos
      # valores solo se pasan a la build de iOS; el .csproj no cambia, asi que
      # Android (produccion en Play Store) conserva su versionado intacto.
      - name: Compute version
        run: |
          echo "DISPLAY_VERSION=1.5.2" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      # --- Compilacion -----------------------------------------------------
      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -p:TargetFramework=net10.0-ios

      - name: Build & publish IPA
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -f net10.0-ios \
            -c ${{ env.CONFIGURATION }} \
            -p:ArchiveOnBuild=true \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="${{ secrets.IOS_SIGNING_IDENTITY }}" \
            -p:CodesignProvision="$PROFILE_NAME" \
            -p:ApplicationId=${{ env.BUNDLE_ID }} \
            -p:ApplicationDisplayVersion=${{ env.DISPLAY_VERSION }} \
            -p:ApplicationVersion=${{ env.BUILD_NUMBER }} \
            -o $RUNNER_TEMP/output

      - name: Locate IPA
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No se encontro ninguna IPA. Revisa el log de compilacion."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA encontrada: $IPA_PATH"

      # Guarda la IPA como artefacto descargable (respaldo por si quieres
      # instalarla manualmente ademas de subirla a TestFlight).
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: appmetepec-ios-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      # --- Subida a TestFlight ---------------------------------------------
      # Usa una API Key de App Store Connect (App Store Connect > Users and
      # Access > Integrations > App Store Connect API).
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          # xcrun altool/notarytool usan un archivo AuthKey en ~/.appstoreconnect
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
